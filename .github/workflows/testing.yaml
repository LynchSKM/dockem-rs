name: "Unit Tests"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Run the tests for the Unix platforms
        run: task test-unix

  docker-config-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_CI_TEST_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Verify docker config.json exists
        run: |
          test -f ~/.docker/config.json
          echo "Docker config.json found at ~/.docker/config.json"
          cat ~/.docker/config.json | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'auths' in d, 'No auths in config'; print('Registries:', list(d['auths'].keys()))"

      - name: Build the CLI
        working-directory: cli
        run: cargo build

      - name: Test CLI reads docker config.json without explicit credentials
        working-directory: cli
        run: |
          # Create a minimal Dockerfile and version file for the test
          mkdir -p /tmp/dockem-test
          echo 'FROM alpine:latest' > /tmp/dockem-test/Dockerfile
          echo '{"version": "0.0.1"}' > /tmp/dockem-test/package.json

          # Run the build command without --docker-username and --docker-password
          # to verify config.json auth is picked up. The token has write access
          # so this should complete a full build+push cycle.
          cargo run -- build \
            --directory=/tmp/dockem-test \
            --dockerfile-path=/tmp/dockem-test/Dockerfile \
            --version-file=/tmp/dockem-test/package.json \
            --image-name="${{ secrets.DOCKERHUB_CI_TEST_REPO }}" \
            --registry=docker.io \
            --tag=ci-config-test
