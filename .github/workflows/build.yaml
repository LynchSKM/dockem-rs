name: "Build"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-unix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64
          - target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
          - target: x86_64-apple-darwin
            os_name: macos
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Get version from Cargo.toml
        id: version
        run: echo "version=$(grep '^version' cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build for ${{ matrix.target }}
        working-directory: cli
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin dockem-rs

      - name: Prepare artifact
        run: |
          mkdir -p release
          version="v${{ steps.version.outputs.version }}"
          mv "cli/target/${{ matrix.target }}/release/dockem-rs" "release/dockem-rs-${version}-${{ matrix.os_name }}-${{ matrix.arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockem-rs-${{ matrix.os_name }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get version from Cargo.toml
        id: version
        shell: bash
        run: echo "version=$(grep '^version' cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build for Windows
        working-directory: cli
        run: cargo build --release --bin dockem-rs

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release
          version="v${{ steps.version.outputs.version }}"
          mv "cli/target/release/dockem-rs.exe" "release/dockem-rs-${version}-windows-x86_64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockem-rs-windows-x86_64
          path: release/
          if-no-files-found: error
